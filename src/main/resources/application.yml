server:
  port: 8080

assist:
  qwen:
    # 不配 key 时走内置 Mock，页面仍可完整体验。
    # 配上后走通义千问 OpenAI 兼容接口。
    api-key: ${DASHSCOPE_API_KEY:}
    model: ${QWEN_MODEL:qwen-plus}
    base-url: ${QWEN_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    timeout-ms: 20000
  wecom:
    token: ${WECOM_TOKEN:demo-token}

logging:
  level:
    com.zhangchong.assist: INFO
